name: Build

# Reusable workflow that builds and tests the library on all supported platforms, and optionally
# publishes the artifacts to the local maven repository and uploads them.
# It is called by test.yml, snapshot.yml and release.yml: do not add triggers here.

on:
  workflow_call:
    inputs:
      channel:
        description: 'Publication channel (`release` or `snapshot`). When left empty, we only build and test: nothing is published or uploaded.'
        type: string
        default: ''
      gradleArgs:
        description: 'Extra arguments passed to the gradle publication tasks.'
        type: string
        default: ''

jobs:

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macOS-latest
            label: macos
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Cached Gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Check
        run: ./gradlew check
      - name: Publish Linux
        if: inputs.channel != '' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew publishLinuxArm64PublicationToMavenLocal publishLinuxX64PublicationToMavenLocal ${{ inputs.gradleArgs }}
      - name: Publish MacOS
        if: inputs.channel != '' && matrix.os == 'macOS-latest'
        shell: bash
        run: ./gradlew publishToMavenLocal ${{ inputs.gradleArgs }}
      - name: Copy artifact files
        if: inputs.channel != ''
        run: |
          mkdir -p maven-local/${{ inputs.channel }}
          cp -r ~/.m2/repository/* maven-local/${{ inputs.channel }}
      - name: Upload artifacts
        if: inputs.channel != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.channel }}-${{ matrix.label }}
          path: |
            maven-local
            !maven-local/**/maven-metadata-local.xml
